name: Xiangqi game
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: xiangqi-shared-board
  cancel-in-progress: false
jobs:
  move:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'Xiangqi move:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate and apply move
        id: validate
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, 'xiangqi')
          from game import initial, apply, render
          path=Path('state/game.json')
          s=json.loads(path.read_text()) if path.exists() else initial()
          m=re.fullmatch(r'\s*xiangqi:\s*([a-i][0-9])-([a-i][0-9])\s*',os.environ.get('ISSUE_BODY',''),re.I)
          ok=False; message='棋步格式无效。'
          if m:
            a,b=m.group(1).lower(),m.group(2).lower()
            try:
              apply(s,('abcdefghi'.index(a[0]),int(a[1]),'abcdefghi'.index(b[0]),int(b[1])))
              path.parent.mkdir(exist_ok=True); path.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\\n')
              render(s); ok=True; message='合法走法已接受，棋盘已更新。'
            except ValueError as e: message=str(e)
          Path('move-result.json').write_text(json.dumps({'accepted':ok,'message':message},ensure_ascii=False))
          print('accepted='+str(ok).lower()+' message='+message)
          PY
          echo "accepted=$(python -c 'import json;print(str(json.load(open("move-result.json"))["accepted"]).lower())')" >> "$GITHUB_OUTPUT"
      - name: Generate initial board
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p state
          mkdir -p state
          if [ ! -f state/game.json ]; then
            python -c "import sys,json;sys.path.insert(0,'xiangqi');from game import initial;open('state/game.json','w').write(json.dumps(initial(),ensure_ascii=False,indent=2)+'\\n')"
          fi
          python xiangqi/game.py
      - name: Commit board
        if: steps.validate.outputs.accepted == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/game.json assets/xiangqi.svg README.md
          git diff --cached --quiet || (git commit -m "Update shared Xiangqi board" && git push)
      - name: Comment and close move issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('move-result.json', 'utf8'));
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body: r.message});
            await github.rest.issues.update({...context.repo, issue_number: context.issue.number, state: 'closed'});
